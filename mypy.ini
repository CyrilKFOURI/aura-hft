[mypy]
python_version = 3.12
warn_unused_ignores = True

# The golden model decodes ITCH into loosely typed dicts; typed message
# dataclasses come with the golden-model rewrite in step P2.
[mypy-sim.*]
ignore_errors = True

# Research code uses numpy arrays heavily; checked by its own tests (pytest research).
[mypy-research.*]
ignore_errors = True
