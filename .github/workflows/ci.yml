name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verification:
    name: RTL + golden model + server + driver
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build verification image (cached, Verilator built from source)
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: aura-hft-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Lint & typecheck
        run: docker run --rm -v "$PWD":/work aura-hft-ci make lint typecheck
      - name: Tests
        run: docker run --rm -v "$PWD":/work aura-hft-ci make test

  client:
    name: Dashboard (typecheck, lint, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
